version: '3.8'

services:
  kumovault-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kumovault-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - KV_ENV=production
      - KV_STORAGE_PATH=/var/lib/kumovault/data
      - REDIS_HOST=redis-cache
    volumes:
      - kv_data:/var/lib/kumovault/data
    depends_on:
      - redis-cache
    networks:
      - internal-net

  redis-cache:
    image: redis:6.2-alpine
    container_name: kumovault-redis
    restart: unless-stopped
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  kv_data:
    driver: local
